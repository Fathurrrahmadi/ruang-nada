<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk - Ruang Nada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="flex min-h-screen items-center justify-center bg-background p-6 text-on-surface">
  <main class="w-full max-w-md">

    <div class="mb-8 text-center">
      <span class="icon mx-auto h-10 w-10 text-primary">music_note</span>
      <h1 class="mt-2 font-serif text-4xl">Ruang Nada</h1>
      <p class="mt-1 text-sm text-on-surface-variant">Sistem Rental Alat Musik Mistis</p>
    </div>

    <form id="login-form" class="space-y-4 rounded-xl bg-surface-container-low p-6" novalidate>
      <p id="login-error" class="hidden rounded-lg bg-error-container p-3 text-sm text-on-error-container"></p>

      <div>
        <label for="email" class="mb-1 block text-sm font-semibold">Email</label>
        <input id="email" type="email" placeholder="nama@email.com" autocomplete="username"
          class="w-full rounded-lg bg-surface-container-lowest px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary" />
        <p id="error-email" class="mt-1 hidden text-sm text-error"></p>
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-semibold">Kata sandi</label>
        <input id="password" type="password" autocomplete="current-password"
          class="w-full rounded-lg bg-surface-container-lowest px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary" />
        <p id="error-password" class="mt-1 hidden text-sm text-error"></p>
      </div>

      <button type="submit"
        class="w-full rounded-lg bg-primary-container px-4 py-2 text-sm font-semibold text-on-primary-container hover:opacity-90">
        Masuk
      </button>
    </form>

  </main>

  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
