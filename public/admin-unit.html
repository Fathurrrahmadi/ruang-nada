<!DOCTYPE html>
<html lang="id" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kelola Unit - Ruang Nada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="min-h-screen bg-background text-on-surface">
  <aside id="sidebar"
    class="no-print fixed left-0 top-0 z-30 hidden h-screen w-64 border-r border-outline-variant bg-surface-container-low p-4 md:block">
  </aside>
  <header id="topbar"
    class="no-print fixed left-0 right-0 top-0 z-20 flex h-16 items-center justify-between border-b border-outline-variant bg-surface px-6 md:left-64">
  </header>

  <main class="pt-16 md:ml-64">
    <div class="mx-auto max-w-7xl space-y-6 p-6">

      <div>
        <h1 class="font-serif text-3xl">Manajemen Unit Instrumen</h1>
        <p class="mt-1 text-sm text-outline">
          Kode unit harus unik, tetapi nama unit boleh sama. Satu unit bisa punya beberapa kategori.
          Status "disewa" diatur otomatis oleh transaksi.
        </p>
      </div>

      <div class="grid gap-6 xl:grid-cols-3">

        <section class="overflow-hidden rounded-xl bg-surface-container-lowest xl:col-span-2">
          <div class="flex items-center justify-between bg-surface-container-low px-4 py-3">
            <span class="text-xs uppercase tracking-wider text-outline">Daftar Unit</span>
            <span id="total" class="text-xs text-outline"></span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead>
                <tr class="text-xs uppercase tracking-wider text-outline">
                  <th class="px-4 py-3">Kode</th>
                  <th class="px-4 py-3">Nama Unit</th>
                  <th class="px-4 py-3">Kategori</th>
                  <th class="px-4 py-3">Tarif / Hari</th>
                  <th class="px-4 py-3">Status</th>
                  <th class="px-4 py-3 text-right">Aksi</th>
                </tr>
              </thead>
              <tbody id="unit-rows"></tbody>
            </table>
          </div>
        </section>

        <section class="self-start overflow-hidden rounded-xl bg-surface-container-low">
          <div class="bg-surface-container px-4 py-3">
            <h2 id="form-title" class="text-lg font-semibold">Tambah Unit</h2>
          </div>

          <form id="unit-form" class="space-y-4 p-4" novalidate>
            <div class="hidden">
              <label for="unit_code" class="mb-1 block text-sm font-semibold">Kode Unit</label>
              <input id="unit_code" type="text" placeholder="contoh: RN-GML-003"
                class="w-full rounded-lg bg-surface-container-lowest px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary uppercase" />
              <p id="error-unit_code" class="mt-1 hidden text-sm text-error"></p>
            </div>

            <div>
              <label for="unit_name" class="mb-1 block text-sm font-semibold">Nama Unit</label>
              <input id="unit_name" type="text"
                class="w-full rounded-lg bg-surface-container-lowest px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary" />
              <p id="error-unit_name" class="mt-1 hidden text-sm text-error"></p>
            </div>

            <div>
              <label for="description" class="mb-1 block text-sm font-semibold">Deskripsi</label>
              <textarea id="description" rows="2"
                class="w-full rounded-lg bg-surface-container-lowest px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary"></textarea>
            </div>

            <div>
              <label for="daily_rate" class="mb-1 block text-sm font-semibold">Tarif Sewa Harian (Rp)</label>
              <input id="daily_rate" type="number" min="0" step="1000"
                class="w-full rounded-lg bg-surface-container-lowest px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary" />
              <p id="error-daily_rate" class="mt-1 hidden text-sm text-error"></p>
            </div>

            <div>
              <label for="status" class="mb-1 block text-sm font-semibold">Status</label>
              <select id="status"
                class="w-full rounded-lg bg-surface-container-lowest px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary">
                <option value="tersedia">Tersedia</option>
                <option value="maintenance">Maintenance</option>
                <option value="disewa" disabled>Disewa (otomatis)</option>
              </select>
              <p id="error-status" class="mt-1 hidden text-sm text-error"></p>
            </div>

            <div>
              <span class="mb-1 block text-sm font-semibold">Kategori (boleh lebih dari satu)</span>
              <div id="category-list"
                class="grid grid-cols-2 gap-2 rounded-lg bg-surface-container-lowest p-3 text-sm"></div>
              <p id="error-category_ids" class="mt-1 hidden text-sm text-error"></p>
            </div>

            <div class="flex justify-end gap-2">
              <button type="button" onclick="resetForm()"
                class="rounded-lg bg-surface-container px-4 py-2 text-sm text-on-surface-variant hover:bg-surface-container-high">
                Batal
              </button>
              <button type="submit"
                class="rounded-lg bg-primary-container px-4 py-2 text-sm font-semibold text-on-primary-container hover:opacity-90">
                Simpan
              </button>
            </div>
          </form>

          <p id="delete-warning"
            class="m-4 mt-0 hidden rounded-lg bg-error-container p-3 text-sm text-on-error-container"></p>
        </section>

      </div>

    </div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/unit.js"></script>
</body>

</html>
